[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspark-ai-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # AI / ML — smolagents CodeAgent writes+executes PySpark code and self-repairs
    # from tracebacks; LiteLLM routes it to a local Ollama coder model.
    "smolagents>=1.15.0",
    "litellm>=1.55.0",
    # Pinned below 2.0 — that release renamed FastMCP to MCPServer and moved
    # it out of mcp.server.fastmcp, breaking the standard `from
    # mcp.server.fastmcp import FastMCP` pattern src/mcp_server.py relies on.
    "mcp[cli]>=1.0.0,<2.0.0",
    # API
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    # Data
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    # Spark compute — Databricks Connect bundles its own pyspark-compatible
    # client; a plain `pyspark` dependency cannot coexist with it.
    "databricks-connect>=15.4",
    "sqlglot>=25.0.0",
    # Utilities
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
